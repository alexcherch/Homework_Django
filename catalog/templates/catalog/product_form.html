{% extends 'catalog/base.html' %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <div class="card p-4 shadow-sm bg-white border-0">
        <h1 class="h3 fw-bold text-dark mb-4 text-center">Добавление нового товара</h1>
        
        <!-- Атрибут enctype обязателен для загрузки файлов изображений -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="name" class="form-label text-muted small fw-bold">Название товара *</label>
                <input type="text" name="name" class="form-control py-2" id="name" placeholder="Например: Смартфон X" required>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label text-muted small fw-bold">Категория *</label>
                <select name="category" class="form-select py-2" id="category" required>
                    <option value="" disabled selected>Выберите категорию...</option>
                    {% for category in categories %}
                        <option value="{{ category.pk }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label text-muted small fw-bold">Цена (руб.) *</label>
                <input type="number" step="0.01" name="price" class="form-control py-2" id="price" placeholder="0.00" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label text-muted small fw-bold">Изображение товара</label>
                <input type="file" name="image" class="form-control py-2" id="image" accept="image/*">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label text-muted small fw-bold">Описание товара *</label>
                <textarea name="description" class="form-control" id="description" rows="4" placeholder="Введите подробное описание товара..." required></textarea>
            </div>

            <div class="d-flex gap-3 mt-4">
                <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary w-50 py-2 fw-bold">Отмена</a>
                <button type="submit" class="btn btn-success w-50 py-2 fw-bold">Сохранить товар</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
