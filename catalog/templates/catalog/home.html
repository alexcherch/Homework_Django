{% extends 'catalog/base.html' %}

{% block content %}
<div class="text-center my-5">
    <h1 class="display-4 fw-normal mb-3">Главная</h1>

</div>

<!-- БЛОК С КАРТОЧКАМИ ТОВАРОВ -->
<div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
    <!-- Сюда в Задании 2 мы вставим динамический цикл вывода товаров из базы данных -->
    <div class="col">
        <div class="card h-100 shadow-sm">

            </div>
            <div class="card-body text-center d-flex flex-column justify-content-between">

                <ul class="list-unstyled mt-3 mb-4 text-muted small">
                    <li>10 users included</li>

                    <li>Help center access</li>

                <button type="button" class="btn btn-w-100 btn-outline-primary py-2">Купить</button>
            </div>
        </div>
    </div>
