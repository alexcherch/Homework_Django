{% extends 'catalog/base.html' %}

{% block content %}
<div class="container my-4" style="max-width: 700px;">
    <div class="card p-4 shadow-sm bg-white border-0">
        <h1 class="h3 fw-bold text-dark mb-4 text-center">
            {% if object %}Редактирование статьи{% else %}Создание новой статьи{% endif %}
        </h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label text-muted small fw-bold">Заголовок статьи *</label>
                <input type="text" name="title" class="form-control py-2" id="title" value="{{ object.title|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label text-muted small fw-bold">Превью (изображение)</label>
                <input type="file" name="image" class="form-control py-2" id="image" accept="image/*">
            </div>

            <div class="mb-3">
                <label for="content" class="form-label text-muted small fw-bold">Содержимое статьи *</label>
                <textarea name="content" class="form-control" id="content" rows="8" required>{{ object.content|default:'' }}</textarea>
            </div>

            <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_published" id="is_published" {% if object %}{% if object.is_published %}checked{% endif %}{% else %}checked{% endif %}>
                <label class="form-check-check-label text-muted small fw-bold" for="is_published">Опубликовать на сайте</label>
            </div>

            <div class="d-flex gap-3 mt-4">
                <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary w-50 py-2 fw-bold">Отмена</a>
                <button type="submit" class="btn btn-success w-50 py-2 fw-bold">Сохранить статью</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
