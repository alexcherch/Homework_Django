{% extends 'catalog/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm bg-white border-0 text-center">
        <h1 class="h3 fw-bold text-danger mb-3">Удаление статьи</h1>
        <p class="text-muted fs-5 mb-4">Вы уверены, что хотите навсегда удалить статью <br><strong>«{{ object.title }}»</strong>?</p>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-3">
                <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary w-50 py-2 fw-bold">Отмена</a>
                <button type="submit" class="btn btn-danger w-50 py-2 fw-bold">Да, удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
