{% extends 'catalog/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 800px;">
    <div class="mb-4">
        <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary">← Назад к списку статей</a>
    </div>

    <article class="bg-white p-5 rounded shadow-sm">
        <h1 class="display-5 fw-bold text-dark mb-3">{{ blog.title }}</h1>

        <div class="d-flex justify-content-between text-muted small border-bottom pb-3 mb-4">
            <span>Опубликовано: {{ blog.created_at|date:"d.m.Y H:i" }}</span>
            <span>👁 Просмотров: {{ blog.views_count }}</span>
        </div>

        {% if blog.image %}
            <div class="text-center bg-light p-3 rounded mb-4" style="max-height: 400px; overflow: hidden;">
                <img src="{{ blog.image.url }}" class="img-fluid rounded" alt="{{ blog.title }}" style="max-height: 380px; object-fit: contain;">
            </div>
        {% endif %}

        <div class="text-dark fs-5 lh-lg" style="text-align: justify; white-space: pre-line;">
            {{ blog.content }}
        </div>

        <div class="d-flex gap-2 mt-5 pt-4 border-top">
            <a href="{% url 'blog:update' blog.pk %}" class="btn btn-primary px-4 fw-bold">Редактировать статью</a>
            <a href="{% url 'blog:delete' blog.pk %}" class="btn btn-outline-danger px-4">Удалить</a>
        </div>
    </article>
</div>
{% endblock %}
